<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FasdeqOS</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#14151a;--mut:#5b5f6b;--ac:#4647e8;--acf:#fff;--bd:#dfe1e8;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1015;--card:#17181f;--ink:#eceef4;--mut:#9a9fae;--ac:#8d8eff;--acf:#0f1015;--bd:#272a35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--ac)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.logo{font-weight:800;font-size:18px;letter-spacing:-.01em}
.hl{display:flex;align-items:center;gap:20px}
.src{font-weight:600;font-size:14px;color:var(--mut);text-decoration:none}
.src:hover{color:var(--ac)}
.lang{display:flex;gap:4px;padding:3px;border:1px solid var(--bd);border-radius:999px;background:var(--card)}
.lang button{border:0;background:none;color:var(--mut);font:600 13px inherit;padding:5px 12px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--ac);color:var(--acf)}
button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hero{max-width:1100px;margin:auto;padding:80px 28px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;flex:1;width:100%}
h1{font-size:clamp(34px,5vw,56px);line-height:1.08;letter-spacing:-.03em;margin:0 0 20px}
.sub{font-size:19px;color:var(--mut);max-width:34em;margin:0 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 22px;border-radius:12px;font-weight:700;text-decoration:none;border:1px solid var(--ac)}
.btn.p{background:var(--ac);color:var(--acf)}
.win{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 24px 60px -24px rgba(20,21,40,.45);overflow:hidden}
.bar{display:flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:1px solid var(--bd);color:var(--mut);font-size:13px}
.bar i{width:12px;height:12px;border-radius:50%;background:#ff5f57}
.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.bar span{margin-left:8px;font-weight:600}
.tree{list-style:none;margin:0;padding:10px}
.tree li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;border-radius:9px;font-size:14.5px}
.tree li:nth-child(odd){background:color-mix(in srgb,var(--ac) 7%,transparent)}
.tree li span{display:inline-flex;align-items:center;gap:8px}
.tree svg{width:15px;height:15px;color:var(--ac);flex-shrink:0}
.tree b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px}
.tree em{font-style:normal;color:var(--mut);font-size:13px}
footer{text-align:center;color:var(--mut);padding:24px 28px 36px;font-size:14px}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding-top:44px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<li><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><b>Library</b></span><em data-t="w3"></em></li>
<li><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><b>root</b></span><em data-t="w7"></em></li>
<li><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><b>System</b></span><em data-t="w1"></em></li>
<li><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><b>Users</b></span><em data-t="w4"></em></li>
<li><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><b>Volumes</b></span><em data-t="w5"></em></li>
</ul>
</div>

<footer><span data-t="f"></span> <a href="https://github.com/Fasdeq13/fasdeqOS/tree/main">GitHub</a></footer>
